<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><title>Lottery balls illustrating that each draw is independent of the last</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1A14"/><stop offset="1" stop-color="#16271D"/></linearGradient><radialGradient id="gl" cx="70%" cy="30%" r="60%"><stop offset="0" stop-color="#2FD36E" stop-opacity=".35"/><stop offset="1" stop-color="#2FD36E" stop-opacity="0"/></radialGradient><radialGradient id="ball" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#F7D36B"/><stop offset="1" stop-color="#B8861E"/></radialGradient><radialGradient id="ballg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#5BEA97"/><stop offset="1" stop-color="#138A44"/></radialGradient></defs><rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#gl)"/><text x="400" y="110" font-family="Urbanist,Arial" font-weight="800" font-size="34" fill="#F7D36B" text-anchor="middle">Every draw starts fresh</text><circle cx="190" cy="268.4" r="56" fill="#000" opacity=".25"/><circle cx="190" cy="260" r="56" fill="url(#ball)"/><circle cx="190" cy="260" r="29.12" fill="#fff"/><text x="190" y="271.2" text-anchor="middle" font-family="Urbanist,Arial" font-weight="900" font-size="34" fill="#0F1A14">14</text><circle cx="330" cy="268.4" r="56" fill="#000" opacity=".25"/><circle cx="330" cy="260" r="56" fill="url(#ball)"/><circle cx="330" cy="260" r="29.12" fill="#fff"/><text x="330" y="271.2" text-anchor="middle" font-family="Urbanist,Arial" font-weight="900" font-size="34" fill="#0F1A14">14</text><circle cx="470" cy="268.4" r="56" fill="#000" opacity=".25"/><circle cx="470" cy="260" r="56" fill="url(#ball)"/><circle cx="470" cy="260" r="29.12" fill="#fff"/><text x="470" y="271.2" text-anchor="middle" font-family="Urbanist,Arial" font-weight="900" font-size="34" fill="#0F1A14">14</text><circle cx="610" cy="268.4" r="56" fill="#000" opacity=".25"/><circle cx="610" cy="260" r="56" fill="url(#ballg)"/><circle cx="610" cy="260" r="29.12" fill="#fff"/><text x="610" y="271.2" text-anchor="middle" font-family="Urbanist,Arial" font-weight="900" font-size="34" fill="#0F1A14">?</text><text x="400" y="400" font-family="Urbanist,Arial" font-weight="600" font-size="22" fill="#B9C6BE" text-anchor="middle">Past results do not change the next draw</text></svg>