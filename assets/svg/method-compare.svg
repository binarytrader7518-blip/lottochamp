<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"><title>Comparison showing equal odds per ticket for each number-picking method</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1A14"/><stop offset="1" stop-color="#16271D"/></linearGradient><radialGradient id="gl" cx="70%" cy="30%" r="60%"><stop offset="0" stop-color="#2FD36E" stop-opacity=".35"/><stop offset="1" stop-color="#2FD36E" stop-opacity="0"/></radialGradient><radialGradient id="ball" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#F7D36B"/><stop offset="1" stop-color="#B8861E"/></radialGradient><radialGradient id="ballg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#5BEA97"/><stop offset="1" stop-color="#138A44"/></radialGradient></defs><rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#gl)"/><text x="120" y="150" font-family="Urbanist,Arial" font-weight="700" font-size="24" fill="#fff" text-anchor="start">Random quick pick</text><rect x="420" y="126" width="260" height="30" rx="15" fill="#16271D"/><rect x="420" y="126" width="130" height="30" rx="15" fill="#B9C6BE"/><text x="120" y="250" font-family="Urbanist,Arial" font-weight="700" font-size="24" fill="#fff" text-anchor="start">Your own picks</text><rect x="420" y="226" width="260" height="30" rx="15" fill="#16271D"/><rect x="420" y="226" width="130" height="30" rx="15" fill="#B9C6BE"/><text x="120" y="350" font-family="Urbanist,Arial" font-weight="700" font-size="24" fill="#fff" text-anchor="start">Lotto Champ set</text><rect x="420" y="326" width="260" height="30" rx="15" fill="#16271D"/><rect x="420" y="326" width="130" height="30" rx="15" fill="#2FD36E"/><text x="400" y="450" font-family="Urbanist,Arial" font-weight="700" font-size="22" fill="#F7D36B" text-anchor="middle">Same jackpot odds per ticket, whichever method you use</text></svg>